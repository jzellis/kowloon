name: 💡 Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? For open-ended brainstorming, [Discussions → Ideas](https://github.com/orgs/kowloon-network/discussions) is often the better home. For a concrete, specific request, this is the place.
  - type: dropdown
    id: area
    attributes:
      label: Which part of Kowloon?
      options:
        - Web app
        - Mobile app
        - Server / federation
        - Client library
        - Whole project / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've already tried or considered?
    validations:
      required: false
